<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0d10">
  <title>PocketDesk</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/desk.css">
</head>
<body>
  <main id="stage" class="stage">
    <canvas id="screen" tabindex="0" hidden></canvas>

    <section id="pair" class="panel" hidden>
      <img src="/icon.svg" alt="" width="56" height="56">
      <h1>Pair with your phone</h1>
      <p class="muted">Open <b>PocketDesk</b> on the phone and type the 6-digit code it shows.</p>
      <div id="code" class="code" aria-live="polite"></div>
      <input id="code-input" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="Pairing code">
      <div id="keypad" class="keypad"></div>
      <p id="pair-error" class="error"></p>
      <p class="muted small">No PocketDesk yet? <a href="/get">Get the app</a> · <a href="/about">What is this?</a></p>
    </section>

    <section id="msg" class="panel" hidden>
      <div class="spinner" id="msg-spinner"></div>
      <h1 id="msg-title">Connecting…</h1>
      <p id="msg-body" class="muted"></p>
      <div id="msg-actions" class="actions"></div>
    </section>

    <div id="hint" class="hint" hidden></div>
  </main>

  <nav id="taskbar" class="taskbar" aria-label="Taskbar">
    <button id="btn-apps" class="tb-btn apps" title="Apps (Windows key)" aria-haspopup="true">
      <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <button id="btn-back" class="tb-btn" title="Back (Esc)">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="btn-home" class="tb-btn" title="Desktop">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="7" fill="none" stroke-width="2.2"/></svg>
    </button>
    <div id="tasks" class="tasks"></div>
    <div class="tb-right">
      <button id="btn-sound" class="tb-btn" title="Sound">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke-width="2" stroke-linecap="round"/><path class="mute" d="M16 9l5 6M21 9l-5 6" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-full" class="tb-btn" title="Full screen (F11)">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-settings" class="tb-btn" title="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="3" fill="none" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <span id="status" class="status" title=""><span class="dot"></span><span id="status-text">Starting</span></span>
      <span id="clock" class="clock"></span>
    </div>
  </nav>

  <div id="menu" class="menu" hidden role="dialog" aria-label="Apps">
    <input id="menu-search" type="search" placeholder="Search apps" autocomplete="off">
    <div id="menu-grid" class="menu-grid"></div>
  </div>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>Settings</h2>
      <label>Sharpness
        <select id="set-maxw">
          <option value="1280">Fast · up to 1280 px</option>
          <option value="1920">Balanced · up to 1920 px</option>
          <option value="2560">Sharp · up to 2560 px</option>
        </select>
      </label>
      <label>Text and window size
        <select id="set-scale">
          <option value="0.85">Compact</option>
          <option value="1">Normal</option>
          <option value="1.25">Large</option>
          <option value="1.5">Extra large (TV)</option>
          <option value="2">Huge</option>
        </select>
      </label>
      <label>Video quality
        <select id="set-bitrate">
          <option value="6">Light · 6 Mbps</option>
          <option value="12">Balanced · 12 Mbps</option>
          <option value="20">High · 20 Mbps</option>
        </select>
      </label>
      <label>Frame rate
        <select id="set-fps">
          <option value="30">30 fps</option>
          <option value="60">60 fps</option>
        </select>
      </label>
      <label>Phone's on-screen keyboard
        <select id="set-keyboard">
          <option value="auto">Hidden (type on this keyboard)</option>
          <option value="on">Show it (no keyboard here, e.g. a TV)</option>
        </select>
      </label>
      <label class="row"><input type="checkbox" id="set-sound"> Play the phone's sound here</label>
      <label class="row"><input type="checkbox" id="set-relay"> Connect through the server when the direct link fails (slower; uses internet both ways)</label>
      <p class="muted small" id="set-stats"></p>
      <div class="actions">
        <button type="button" id="btn-forget" class="ghost danger">Unpair this screen</button>
        <button value="close" class="primary">Done</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/js/desk.js"></script>
</body>
</html>
